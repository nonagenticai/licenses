services:
  licenses:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: licenses-api
    environment:
      # Core Metadata
      SERVICE_NAME: licensing-service
      VERSION: 1.0.0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-0195f48b-d000-7000-8000-000000000001}

      # Application
      PORT: 8544

      # Required whenever ENVIRONMENT=production (main._validate_production_config).
      # Their absence made `docker compose -f docker-compose.yml up` die at import
      # with a RuntimeError before uvicorn ever bound; it was masked only because
      # `docker compose up` auto-merges docker-compose.override.yml, which sets
      # ENVIRONMENT=development. The documented base-only invocation was the broken one.
      METERING_SERVICE_URL: ${METERING_SERVICE_URL:-https://metering.example.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://portal.nonagentic.ai}

      # Point DB_HOST at your Postgres — or at a pgbouncer in front of it, which is what the
      # estate does (hence the 6432 default). Client certificates are mounted below for
      # deployments that terminate mTLS at the pooler; sslmode=disable ignores them.
      DATABASE_URL: postgresql+psycopg://licenses_user:${POSTGRES_PASSWORD_LICENSES}@${DB_HOST:-localhost}:${DB_PORT:-6432}/licenses?sslmode=disable
      # Must not contradict the sslmode already in DATABASE_URL above. It used to
      # say `require` while the DSN said `disable`; the DSN is not TLS-served here,
      # and libpq takes the LAST occurrence, so the appended value silently won.
      POSTGRES_SSLMODE: disable

      # Keycloak Authentication
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://keycloak.example.com}
      KEYCLOAK_REALM: secure-apps
      KEYCLOAK_CLIENT_ID: licensing-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_SSL_VERIFY: false
      CA_CERT_PATH: /app/certs/keycloak-ca-cert.pem
      REALM_NAME: secure-apps

      # Legacy (for compatibility)
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      NODE_ENV: production

    ports:
      - "0.0.0.0:8544:8544"
    expose:
      - "8544"

    networks:
      - workflow-system-network

    restart: unless-stopped

    # Mount certificates
    volumes:
      # PostgreSQL client certificates (mTLS for database authentication)
      - ./certs/ca-cert.pem:/app/certs/ca-cert.pem:ro
      - ./certs/licenses-cert.pem:/app/certs/licenses-cert.pem:ro
      - ./certs/licenses-key.pem:/app/certs/licenses-key.pem:ro

      # Keycloak CA certificate (for HTTPS client validation)
      - ./certs/keycloak-ca-cert.pem:/app/certs/keycloak-ca-cert.pem:ro

    # ----------------------------------------------------------------------
    # Resource Limits
    # ----------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8544/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  workflow-system-network:
    driver: bridge
